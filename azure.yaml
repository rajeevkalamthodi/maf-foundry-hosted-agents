# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: incident-commander
services:
    incident-commander:
        project: src/incident-commander
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: >-
            Incident Commander — a Microsoft Agent Framework multi-agent orchestration sample.
            Incident Commander triages a grid incident report, Grid Operations adds the technical
            outage assessment, and Customer Experience drafts the reviewable customer update.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: incident-commander
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4
                version: "2026-03-05"
              name: gpt-5.4
              sku:
                capacity: 10
                name: GlobalStandard
infra:
    provider: microsoft.foundry
